<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL-ROB | Dobór pompy ciepła</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:#f4f5f7;color:#20242a}.top{background:#fff;border-bottom:1px solid #e6e8eb}.wrap{max-width:920px;margin:auto;padding:18px}.logo{font-weight:950;font-size:38px;letter-spacing:-2px;color:#ed1c24;line-height:1}.logo span{display:block;font-size:14px;letter-spacing:2px;color:#222;margin-top:7px}.hero{padding:34px 0 12px}.hero h1{font-size:36px;margin:0 0 10px;line-height:1.05}.hero p{color:#646b74;line-height:1.55;max-width:760px;margin:0}.card{background:#fff;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.06);padding:28px;margin:18px 0}.progress{height:8px;background:#edf0f2;border-radius:999px;overflow:hidden}.bar{height:100%;background:#ed1c24;transition:.2s}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#ed1c24;font-weight:900;margin-top:22px}.title{font-size:25px;font-weight:900;margin:5px 0}.desc{color:#69717a;line-height:1.5;margin:0 0 18px}.field{margin:17px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field small{display:block;color:#737b84;margin:0 0 8px;line-height:1.45}.field input,.field textarea,.field select,.toolbar input,.toolbar select{width:100%;border:1px solid #d6dbe1;border-radius:12px;padding:13px 14px;font:inherit;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#ed1c24;box-shadow:0 0 0 3px rgba(237,28,36,.1)}.field textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:850;cursor:pointer}.primary{background:#ed1c24;color:#fff}.secondary{background:#eef0f3;color:#222}.note{background:#fff5f5;border:1px solid #ffd7d8;border-radius:13px;padding:14px;color:#6c3537;line-height:1.45}.check{display:flex;align-items:flex-start;gap:10px}.check input{width:auto;margin-top:4px}.success{text-align:center;padding:38px 12px}.success .ok{width:60px;height:60px;border-radius:50%;background:#e9f7ed;color:#17833a;display:grid;place-items:center;margin:0 auto 15px;font-size:30px;font-weight:900}.footer{text-align:center;color:#7a8088;font-size:13px;line-height:1.6;padding:10px 0 38px}.footer a{color:#7a8088;text-decoration:none}.login{max-width:430px;margin:60px auto}.hidden{display:none}.toolbar{display:grid;grid-template-columns:1fr 220px;gap:12px;margin-bottom:15px}.item{border:1px solid #e1e5e8;border-radius:13px;padding:15px;margin:10px 0;cursor:pointer}.item:hover{border-color:#ed1c24}.meta{font-size:13px;color:#757c85;margin-top:5px}.badge{display:inline-block;background:#f0f2f4;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:850;margin-left:6px}.detail{margin-top:15px;border-top:1px solid #eceef0;padding-top:15px}.qa{padding:11px 0;border-bottom:1px solid #eceef0}.qa b{display:block;margin-bottom:5px}@media(max-width:650px){.wrap{padding:14px}.hero h1{font-size:29px}.card{padding:20px}.grid,.toolbar{grid-template-columns:1fr}.nav .btn{flex:1}.logo{font-size:32px}}</style></head><body><header class="top"><div class="wrap"><div class="logo">El-rob<span>SYSTEMY GRZEWCZE</span></div></div></header><main class="wrap" id="app"></main><script>const API='https://icfziyffsidrvcuqkzyy.supabase.co/functions/v1/elrob-pompy';const Q=[['year','Z którego roku jest budynek?','Np. 2025, lata 80., przed II wojną światową.'],['location','W jakiej miejscowości znajduje się budynek?','Potrzebne do określenia warunków klimatycznych.'],['area','Powierzchnia użytkowa ogrzewana','Podaj m² po podłodze oraz ile m² jest ze skosami i bez skosów.'],['footprint','Obrys budynku','Np. prostokąt 8 × 6 m. Przy nieregularnym obrysie opisz długości ścian.'],['layout','Układ budynku','Np. parter + piętro, parter + poddasze użytkowe, parter + poddasze nieużytkowe.'],['basement','Piwnica i garaż w bryle budynku','Czy dom jest podpiwniczony? Czy garaż jest jedno- lub dwustanowiskowy i czy jest ogrzewany?'],['material','Materiał ścian','Np. Porotherm, Ytong, cegła pełna, pustak.'],['wallThickness','Całkowita grubość ścian','Razem z dociepleniem zewnętrznym, najlepiej w cm.'],['insulation','Docieplenie zewnętrzne','Rodzaj i grubość, np. styropian 15 cm.'],['windows','Stolarka okienna','Np. nowoczesne okna dwu- lub trzyszybowe.'],['windowCount','Liczba okien i dużych przeszkleń','Uwzględnij okna dachowe, balkonowe i duże przeszklenia tarasowe.'],['doors','Drzwi zewnętrzne','Podaj liczbę i rodzaj: stare/nowe, drewniane/metalowe itp.'],['attic','Izolacja poddasza','Rodzaj i grubość, np. wełna mineralna 25 cm.'],['ceilings','Izolacja stropów','Rodzaj i grubość izolacji.'],['floor','Izolacja podłogi parteru','Rodzaj i grubość, np. styropian 8 cm.'],['temp','Oczekiwana temperatura w domu zimą','Np. 22°C.'],['ventilation','Rodzaj wentylacji','Grawitacyjna czy mechaniczna z rekuperacją?'],['heating','Rodzaj instalacji grzewczej','Sama podłogówka, same grzejniki, przewaga podłogówki + grzejniki lub odwrotnie.'],['circuits','Liczba obiegów grzewczych','Np. osobna pompa obiegowa na grzejniki i osobna na podłogówkę.'],['cwu','Ciepła woda użytkowa (CWU)','Liczba osób oraz czy jest wanna i prysznic, czy tylko prysznice.'],['supplyTemp','Temperatura zasilania instalacji CO','Jeśli instalacja już działa: jaka temperatura była potrzebna do ogrzania domu? np. 35°C / 45°C / 50°C.']];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(body){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}function client(){document.getElementById('app').innerHTML='<section class="hero"><h1>Dobór pompy ciepła</h1><p>Odpowiedz na pytania dotyczące budynku. Dzięki temu nasi doradcy będą mogli przygotować się do prawidłowego doboru urządzenia, oględzin i wyceny.</p></section><section class="card" id="card"><div class="progress"><div class="bar" id="bar"></div></div><form id="form"><div id="stage"></div><div class="nav"><button type="button" class="btn secondary" id="back">Wstecz</button><button type="button" class="btn primary" id="next">Dalej</button></div></form></section><div class="footer">EL-ROB Systemy Grzewcze • Jelcz-Laskowice<br><a href="?admin=1">Panel EL-ROB</a></div>';const groups=[{t:'Dane klienta',a:-1,b:-1},{t:'Budynek i wymiary',a:0,b:3},{t:'Konstrukcja budynku',a:4,b:7},{t:'Okna i docieplenie',a:8,b:11},{t:'Izolacja i komfort',a:12,b:15},{t:'Instalacja grzewcza',a:16,b:20},{t:'Podsumowanie',a:21,b:21}];let step=0;const state={contact:{},answers:{},consent:false};const stage=document.getElementById('stage'),bar=document.getElementById('bar'),back=document.getElementById('back'),next=document.getElementById('next');function capture(){stage.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key,b=el.dataset.bucket;if(el.type==='checkbox')state[k]=el.checked;else if(b==='contact')state.contact[k]=el.value;else state.answers[k]=el.value})}function restore(){stage.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key,b=el.dataset.bucket,v=b==='contact'?state.contact[k]:b==='root'?state[k]:state.answers[k];if(el.type==='checkbox')el.checked=!!v;else el.value=v||''})}function render(){const g=groups[step];bar.style.width=Math.round((step+1)/groups.length*100)+'%';back.style.visibility=step===0?'hidden':'visible';next.textContent=step===groups.length-1?'Wyślij formularz':'Dalej';let h='<div class="eyebrow">Etap '+(step+1)+' z '+groups.length+'</div><div class="title">'+g.t+'</div>';if(step===0)h+='<p class="desc">Podaj podstawowe dane kontaktowe oraz miejsce inwestycji.</p><div class="grid"><div class="field"><label>Imię i nazwisko *</label><input required data-bucket="contact" data-key="customer_name"></div><div class="field"><label>Telefon *</label><input required inputmode="tel" data-bucket="contact" data-key="phone"></div></div><div class="field"><label>E-mail</label><input type="email" data-bucket="contact" data-key="email"></div><div class="field"><label>Jak podajesz lokalizację? *</label><select required data-bucket="contact" data-key="investment_type"><option value="">Wybierz</option><option value="adres">Adres budowy</option><option value="dzialka">Numer działki</option></select></div><div class="field"><label>Adres budowy albo numer działki i miejscowość *</label><input required data-bucket="contact" data-key="investment_location" placeholder="np. Gać, ul. ... lub działka nr ..."></div>';else if(step===groups.length-1)h+='<p class="desc">To już wszystko. Jeśli nie znałeś którejś odpowiedzi, może pozostać pusta.</p><div class="note">Formularz służy do wstępnego zebrania danych. Ostateczny dobór urządzenia nastąpi po weryfikacji informacji przez EL-ROB.</div><div class="field check"><input id="consent" type="checkbox" required data-bucket="root" data-key="consent"><label for="consent">Wyrażam zgodę na przetwarzanie podanych danych w celu kontaktu oraz przygotowania doboru i oferty. *</label></div>';else{h+='<p class="desc">Odpowiedz możliwie dokładnie. Jeśli nie znasz odpowiedzi, zostaw pole puste.</p>';for(let i=g.a;i<=g.b;i++){const x=Q[i];h+='<div class="field"><label>'+(i+1)+'. '+esc(x[1])+'</label><small>'+esc(x[2])+'</small><textarea data-bucket="answers" data-key="'+x[0]+'"></textarea></div>'}}stage.innerHTML=h;restore()}function valid(){const bad=[...stage.querySelectorAll('[required]')].find(el=>!el.checkValidity());if(bad){bad.reportValidity();return false}return true}next.onclick=async()=>{capture();if(!valid())return;if(step<groups.length-1){step++;render();scrollTo({top:0,behavior:'smooth'});return}next.disabled=true;next.textContent='Wysyłanie…';const p={action:'submit',customer_name:state.contact.customer_name,phone:state.contact.phone,email:state.contact.email||null,investment_type:state.contact.investment_type,investment_location:state.contact.investment_location,consent:state.consent,answers:state.answers};try{const r=await api(p);if(!r.ok)throw 0;document.getElementById('card').innerHTML='<div class="success"><div class="ok">✓</div><h2>Dziękujemy</h2><p>Formularz został przesłany do EL-ROB. Po przeanalizowaniu informacji skontaktujemy się z Tobą.</p></div>'}catch(e){alert('Nie udało się wysłać formularza. Spróbuj ponownie.');next.disabled=false;next.textContent='Wyślij formularz'}};back.onclick=()=>{capture();if(step>0){step--;render();scrollTo({top:0,behavior:'smooth'})}};render()}function admin(){document.getElementById('app').innerHTML='<section class="card login" id="login"><h2>Panel EL-ROB</h2><p class="desc">Zaloguj się, aby zobaczyć zgłoszenia klientów.</p><div class="field"><input id="pwd" type="password" placeholder="Hasło administratora"></div><button class="btn primary" id="go">Zaloguj</button><div class="meta" id="err"></div></section><section class="card hidden" id="panel"><div class="toolbar"><input id="search" placeholder="Szukaj: klient, telefon, miejscowość…"><select id="filter"><option value="">Wszystkie statusy</option><option value="nowe">Nowe</option><option value="do_kontaktu">Do kontaktu</option><option value="w_trakcie">W trakcie</option><option value="wycenione">Wycenione</option><option value="zakonczone">Zakończone</option></select></div><div id="list"></div></section>';let pass='',rows=[];const login=document.getElementById('login'),panel=document.getElementById('panel'),list=document.getElementById('list'),search=document.getElementById('search'),filter=document.getElementById('filter');const sn=s=>({nowe:'Nowe',do_kontaktu:'Do kontaktu',w_trakcie:'W trakcie',wycenione:'Wycenione',zakonczone:'Zakończone'})[s]||s;document.getElementById('go').onclick=async()=>{pass=document.getElementById('pwd').value;const r=await api({action:'admin_list',password:pass});if(!r.ok){document.getElementById('err').textContent='Nieprawidłowe hasło';return}rows=(await r.json()).rows||[];login.classList.add('hidden');panel.classList.remove('hidden');draw()};function draw(){const q=search.value.toLowerCase(),st=filter.value,a=rows.filter(r=>(!st||r.status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));list.innerHTML=a.length?a.map(r=>'<article class="item" data-id="'+r.id+'"><div><strong>'+esc(r.customer_name)+'</strong><span class="badge">'+esc(sn(r.status))+'</span></div><div class="meta">'+esc(r.phone)+' • '+esc(r.investment_location)+' • '+new Date(r.created_at).toLocaleString('pl-PL')+'</div><div class="detail hidden"></div></article>').join(''):'<p class="desc">Brak zgłoszeń.</p>';document.querySelectorAll('.item').forEach(el=>el.onclick=e=>{if(e.target.tagName!=='SELECT')open(el)})}function open(el){const r=rows.find(x=>x.id===el.dataset.id),d=el.querySelector('.detail');if(!d.classList.contains('hidden')){d.classList.add('hidden');return}let a='';Q.forEach((x,i)=>a+='<div class="qa"><b>'+(i+1)+'. '+esc(x[1])+'</b><div>'+esc((r.answers||{})[x[0]]||'—')+'</div></div>');d.innerHTML='<p><b>Telefon:</b> '+esc(r.phone)+'</p><p><b>E-mail:</b> '+esc(r.email||'—')+'</p><p><b>Inwestycja:</b> '+esc(r.investment_location)+'</p><div class="field"><label>Status</label><select class="status"><option value="nowe">Nowe</option><option value="do_kontaktu">Do kontaktu</option><option value="w_trakcie">W trakcie</option><option value="wycenione">Wycenione</option><option value="zakonczone">Zakończone</option></select></div>'+a;const s=d.querySelector('.status');s.value=r.status;s.onchange=async()=>{const x=await api({action:'admin_status',password:pass,id:r.id,status:s.value});if(x.ok){r.status=s.value;draw()}};d.classList.remove('hidden')}search.oninput=draw;filter.onchange=draw}new URLSearchParams(location.search).get('admin')==='1'?admin():client();</script></body></html>
